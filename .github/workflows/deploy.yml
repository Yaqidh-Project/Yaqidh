name: Deploy Backend to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 68.183.221.222
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd Yaqidh
            git pull origin main
            npx pm2 restart all